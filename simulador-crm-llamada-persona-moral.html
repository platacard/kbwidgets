<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador CRM · Llamada con Persona Moral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA;--card:#FFF;--field:#E6EAF2;--field-hover:#DDE2EC;--ink:#171C26;--muted:#4B5563;--placeholder:#8A94A6;
  --accent:#FF5000;--accent-hover:#E64800;--err:#E11D2E;--ok:#1A9B5B;--ok-bg:#E8F7EF;--bad-bg:#FDECEE;--link:#2B3FEA;
  --info-bg:#E8EEFC;--info-bar:#3B6EF5;--task-bg:#FFF6E0;--task-bar:#FF8A00;--warn-bg:#FFF4E5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.toolbar{max-width:1536px;margin:0 auto;padding:16px 20px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .tb{height:36px;border-radius:999px;border:1px solid #D9DEE7;background:#fff;padding:0 14px;font-weight:500;cursor:pointer;color:var(--ink);font-size:13px}
.toolbar .tb:hover{border-color:var(--accent)}
.toolbar .tb.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar .tb.free.active{background:var(--accent);border-color:var(--accent)}
.toolbar .tb .st{margin-left:6px;color:var(--ok);font-weight:700}
.toolbar .tb.active .st{color:#fff}
.toolbar .sep{width:1px;height:24px;background:#D9DEE7;margin:0 4px}
.toolbar .reset{margin-left:auto;background:transparent;border-color:transparent;color:var(--muted)}
.toolbar .reset:hover{color:var(--ink);border-color:transparent;text-decoration:underline}
.app{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:12px 20px 20px;min-height:calc(100vh - 64px);max-width:1536px;margin:0 auto}
.rail{background:var(--card);border-radius:16px}
.main{display:grid;grid-template-rows:72px 1fr;gap:8px;min-width:0}
.topbar{background:var(--card);border-radius:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;padding:0 20px;min-width:0}
.topbar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 12px}
.mic{width:64px;height:40px;border-radius:10px;background:var(--field);display:flex;align-items:center;justify-content:center;color:#5B6475}
.topbar .name{text-align:center;font-weight:600;font-size:15px}
.hang{display:flex;align-items:center;gap:14px;border:1px solid #F0888F;border-radius:10px;padding:0 14px;height:40px;color:#5B6475;background:#FFF5F5;cursor:pointer;font:inherit}
.hang:hover{background:#FFE9EA}
.hang:disabled{cursor:default;opacity:.6}
.hang svg{color:var(--err)}
.body{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,32%,480px);gap:8px;min-height:680px;min-width:0}
.body.solo{grid-template-columns:minmax(0,1fr)}
.body.solo .side{display:none}
.screen{background:var(--card);border-radius:16px;padding:20px 20px 40px;display:flex;justify-content:center;min-width:0;overflow:hidden}
.col{width:100%;max-width:600px;padding:0 20px;min-width:0}
.side{background:var(--card);border-radius:16px;padding:20px;min-width:0}
.task{background:var(--task-bg);border-left:4px solid var(--task-bar);border-radius:8px;padding:12px 16px;margin-bottom:40px}
.task b{display:block;margin-bottom:4px}
h2{font-size:20px;line-height:24px;font-weight:600;margin:0 0 8px}
h2+.sub{color:var(--muted);margin:0 0 16px}
.informer{border-left:4px solid var(--info-bar);background:var(--info-bg);border-radius:8px;padding:12px 16px;margin:0 0 16px}
.informer b{display:block;margin-bottom:4px}
.informer.plain{background:#fff;border:1px solid #D9DEE7;border-left:4px solid #C9D0DC}
.informer ul{margin:6px 0;padding-left:18px}
.informer.warn{background:var(--warn-bg);border-left-color:var(--task-bar)}
.field{margin-bottom:24px}
.field label.title{display:block;font-size:20px;line-height:24px;font-weight:600;margin-bottom:8px}
.hint{color:var(--muted);margin:-4px 0 12px}
input.txt{width:100%;height:40px;border-radius:8px;border:1px solid transparent;background:var(--field);padding:0 12px;outline:none}
input.txt::placeholder{color:var(--placeholder);text-transform:none}
input.txt:focus{border-color:#B9C2D3;background:#fff}
input.txt:read-only{color:var(--muted)}
.money{position:relative}.money input{padding-left:26px}.money::before{content:"$";position:absolute;left:12px;top:10px;color:var(--placeholder)}
.stack input.txt{margin-bottom:8px}
.stack .err{margin:-4px 0 12px}
.err{display:none;color:var(--err);margin:4px 0 0 12px}
.invalid input.txt,.invalid .radios,.invalid .check{border-color:var(--err)}
.invalid .err{display:block}
.radios{border:1px solid #D9DEE7;border-radius:8px;padding:4px 12px}
.radios label{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.radios input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.check{border:1px solid #D9DEE7;border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.btn{height:40px;border:0;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer;background:var(--field);color:var(--ink);width:100%}
.btn:hover{background:var(--field-hover)}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary:disabled:hover{background:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px}
.badge{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.badge.ok{background:#1DB954;color:#fff}.badge.bad{background:var(--err);color:#fff}.badge.warn{background:var(--task-bar);color:#fff}
/* verificar número */
.phonerow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.phonebox{position:relative}
.phonebox .pre{position:absolute;left:12px;top:10px;color:var(--ink);pointer-events:none}
.phonebox input{padding-left:44px}
/* OTP */
.otpstate{min-height:20px;margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px;font-weight:600}
.otpstate.left{justify-content:flex-start;padding-left:12px;font-weight:400;font-size:13px}
.otpstate .okmsg{color:#0E9F4E}
.otpstate .errmsg{color:var(--err)}
.spin{width:18px;height:18px;border:2px solid #D9DEE7;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.otplinks{display:flex;justify-content:space-between;gap:16px;padding:0 12px;margin-top:12px}
.otplinks a{color:var(--link);text-decoration:none}
.otplinks a:hover{text-decoration:underline}
.otplinks .wait{color:var(--muted)}
/* transcript */
.call .label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.call .label span.step{color:var(--placeholder);font-weight:500;text-transform:none;letter-spacing:0}
.bubble{background:var(--bg);border-radius:12px 12px 12px 4px;padding:10px 14px;margin-bottom:8px;max-width:100%}
.bubble.agent{background:#FFF4EE;border-radius:12px 12px 4px 12px;margin-left:24px}
.bubble .who{font-size:12px;color:var(--muted);margin-bottom:2px}
/* feedback overlay */
.overlay{position:fixed;inset:0;background:rgba(23,28,38,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:28px}
.modal h1{font-size:24px;line-height:30px;margin:0 0 12px}
.modal p{margin:0 0 12px;font-size:15px;line-height:22px}
.checks{list-style:none;margin:16px 0;padding:0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #EEF1F6;font-size:14px;line-height:20px}
.checks li .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px;background:var(--ok)}
.checks li.bad .dot{background:var(--err)}
.checks li b{display:block}
.hidden{display:none !important}
@media (max-width:1000px){.body{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{display:none}.phonerow{grid-template-columns:1fr}}
html,body{overflow-x:hidden}
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div class="app">
  <div class="rail"></div>
  <div class="main">
    <div class="topbar">
      <div class="mic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v4"/></svg></div>
      <div class="name" id="clientName">—</div>
      <button class="hang" id="hang" title="Terminar la llamada"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-3.3 0-6.3.8-8.9 2.3-.7.4-1.1 1.2-1.1 2v2.2c0 .6.5 1.1 1.1 1l3.6-.5c.5-.1.9-.5 1-1l.4-2.2c1.2-.4 2.5-.6 3.9-.6s2.7.2 3.9.6l.4 2.2c.1.5.5.9 1 1l3.6.5c.6.1 1.1-.4 1.1-1v-2.2c0-.8-.4-1.6-1.1-2C18.3 9.8 15.3 9 12 9z"/></svg><span id="timer">0:00</span></button>

    <div class="body" id="body">
      <div class="screen"><div class="col" id="screen"></div></div>

        <div class="call">
          <div class="label"><span>En la llamada</span><span class="step" id="stepLabel"></span></div>
          <div id="transcript"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="feedback">
  <div class="modal">
    <h1 id="fbTitle"></h1>
    <p id="fbIntro"></p>
    <ul class="checks" id="fbChecks"></ul>
    <div class="row2">

    </div>
  </div>
</div>

<script>
/* ---------- Datos ---------- */
/* Cada escenario: datos del cliente, el código OTP que le llega, lo que dice en cada pantalla y lo que se espera del agente */
const FREE = { id:"free", title:"Modo libre", client:"Santa Maria de Santa cruz de la Seros", task:"Título de la tarea", taskDesc:"Descripción de la tarea", say:{}, expect:null };

/* ---------- Estado ---------- */
let S = null;           // escenario

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtPhone = d => d.length>6 ? d.slice(0,2)+' '+d.slice(2,6)+' '+d.slice(6) : d.length>2 ? d.slice(0,2)+' '+d.slice(2) : d;
function otpT(fn,ms){ otpTimers.push(setTimeout(fn,ms)); }
function clearOtp(){ otpTimers.forEach(clearTimeout); otpTimers=[]; clearInterval(resendId); resendId=null; }

/* ---------- Barra de escenarios ---------- */
const progress = {};
function renderMenu(){
  const bar=$('toolbar'); bar.innerHTML='';
  const mk=(sc,cls)=>{const b=document.createElement('button'); b.className='tb '+cls+(S&&S.id===sc.id?' active':'');
    const st=progress[sc.id]; b.innerHTML=esc(sc.title)+(st&&st.ok?'<span class="st">✓</span>':''); b.title=sc.desc||''; b.onclick=()=>start(sc); return b;};
  bar.appendChild(mk(FREE,'free'));
  const sep=document.createElement('div'); sep.className='sep'; bar.appendChild(sep);
  SCENARIOS.forEach(sc=>bar.appendChild(mk(sc,'')));
  const r=document.createElement('button'); r.className='tb reset'; r.textContent='Reiniciar'; r.onclick=()=>start(S||FREE); bar.appendChild(r);
}
function start(sc){
  S=sc; step="link"; log={}; seconds=0; hung=false; clearOtp(); $('hang').disabled=false;
  $('feedback').classList.add('hidden');
  $('clientName').textContent=sc.client;
  $('body').classList.toggle('solo', sc.id==='free');
  clearInterval(timerId); timerId=setInterval(()=>{seconds++; $('timer').textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;},1000);
  $('timer').textContent='0:00';
  renderMenu(); render();
}

/* ---------- Transcripción ---------- */
const STEP_NAMES={link:"Inicio",otp:"Código",otpAgotado:"Intentos agotados",type:"Tipo de empresa",consent:"Consentimiento",company:"Datos de la empresa",noauth:"No autorizado",person:"Datos del representante",noine:"Sin identificación",success:"Solicitud creada",pfae:"Rama PFAE"};
function transcript(key){
  const box=$('transcript'); box.innerHTML='';
  if(!S.expect) return;
  $('stepLabel').textContent=STEP_NAMES[key]||'';
  let lines=(S.say&&S.say[key])||[];
  if(key==='otp' && lines.length>1) lines=lines.slice(0,(log.otpAttempts||0)+1); // el cliente dicta un código por intento
  if(!lines.length){box.innerHTML='<div class="bubble" style="color:var(--muted)">—</div>';return;}
  lines.forEach(([who,txt])=>{
    const d=document.createElement('div'); d.className='bubble '+(who==='a'?'agent':'');
    d.innerHTML=`<div class="who">${who==='a'?'Tú':'Cliente'}</div>${esc(txt)}`;
    box.appendChild(d);
  });
}

/* ---------- Pantallas ---------- */
const taskBlock = () => `<div class="task"><b>${esc(S.task)}</b>${esc(S.taskDesc)}</div>`;

function render(){
  const sc=$('screen');
  clearOtp();
  transcript(step);
  if(step==="link"){
    sc.innerHTML = taskBlock()+`
      <h2>¿El número al que me estoy comunicando es tu número celular y personal? ¿Quieres vincular la tarjeta al número de teléfono… (menciona de nuevo el número de teléfono)?</h2>
      <div class="phonerow">
        <div class="phonebox"><span class="pre">+52</span><input class="txt" id="phone" placeholder="XX XXXX XXXX" inputmode="numeric" maxlength="12" aria-label="Número de teléfono"></div>
        <button class="btn primary" id="verify" disabled>Verificar número telefónico</button>
      </div>`;
    const pi=$('phone');
    const sync=()=>{ const d=pi.value.replace(/\D/g,'').slice(0,10); pi.value=fmtPhone(d); $('verify').disabled=d.length!==10; };
    if(log.phone) pi.value=fmtPhone(log.phone);
    pi.addEventListener('input',sync); sync(); pi.focus();
    pi.addEventListener('keydown',e=>{ if(e.key==='Enter' && !$('verify').disabled) $('verify').click(); });
    $('verify').onclick=()=>{
      const d=pi.value.replace(/\D/g,''); if(d.length!==10) return;
      if(log.phone && log.phone!==d) log.phoneChanged=(log.phoneChanged||0)+1;
      log.phone=d; log.otpWrong=0; step="otp"; render();
    };
  }
  else if(step==="otp"){
    const last4=(log.phone||'').slice(-4);
    sc.innerHTML = taskBlock()+`
      <h2>Ingresa el código</h2>
      <p class="sub">Lo enviamos al … ${esc(last4)} vía SMS y WhatsApp</p>
      <div class="field" id="fOtp" style="margin-bottom:0"><input class="txt" id="otp" placeholder="Código" inputmode="numeric" maxlength="4" autocomplete="one-time-code" aria-label="Código"><div class="otpstate" id="otpState"></div></div>
      <div class="otplinks"><a href="#" id="changeNum">Cambiar número</a><span id="resend" class="wait">Reenviar código en <span id="resendN">25</span> seg</span></div>
      ${S.expect?'':'<div class="hint" style="margin:20px 0 0 12px">Para practicar: cualquier código de 4 dígitos es correcto, menos <code style="background:var(--field);padding:2px 8px;border-radius:6px;font-size:13px">0000</code> — úsalo para practicar el código incorrecto (tres veces agota los intentos).</div>'}`;
    const inp=$('otp'); let busy=false;
    inp.focus();
    inp.addEventListener('input',()=>{
      inp.value=inp.value.replace(/\D/g,'').slice(0,4);
      $('fOtp').classList.remove('invalid'); $('otpState').className='otpstate'; $('otpState').innerHTML='';
      if(inp.value.length===4 && !busy) check();
    });
    function check(){
      busy=true; inp.readOnly=true;
      $('otpState').innerHTML='<span class="spin"></span>';
      otpT(()=>{
        const code=inp.value, ok = S.expect ? code===S.otp : code!=='0000';
        log.otpAttempts=(log.otpAttempts||0)+1;
        if(ok){
          log.otpOk=true;
          $('otpState').innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E9F4E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" fill="#0E9F4E" stroke="none"/><path d="M7 12l3.5 3.5L17 9" stroke="#fff"/></svg><span class="okmsg">El código es correcto</span>';
          otpT(()=>{ step="type"; render(); },1000);
          return;
        }
        log.otpWrong=(log.otpWrong||0)+1;
        $('fOtp').classList.add('invalid');
        if(log.otpWrong>=3){
          log.otpExhausted=true;
          $('otpState').className='otpstate left'; $('otpState').innerHTML='<span class="errmsg">All attempts to validate the code have been exhausted</span>';
          otpT(()=>{ step="otpAgotado"; render(); },1500);
          return;
        }
        $('otpState').innerHTML='';
        busy=false; inp.readOnly=false; inp.focus(); inp.select();
        transcript('otp');
      },800);
    }
    $('changeNum').onclick=e=>{ e.preventDefault(); if(busy) return; log.changeNumber=(log.changeNumber||0)+1; step="link"; render(); };
    const startResend=()=>{
      clearInterval(resendId);
      let left=25; const box=$('resend'); box.className='wait'; box.innerHTML=`Reenviar código en <span id="resendN">${left}</span> seg`;
      resendId=setInterval(()=>{
        left--;
        if(left<=0){
          clearInterval(resendId); resendId=null;
          box.className=''; box.innerHTML='<a href="#" id="resendLink">Reenviar código</a>';
          $('resendLink').onclick=ev=>{ ev.preventDefault(); log.resent=(log.resent||0)+1; startResend(); };
        } else if($('resendN')) $('resendN').textContent=left;
      },1000);
    };
    startResend();
  }
  else if(step==="otpAgotado"){
    sc.innerHTML = taskBlock()+`
      <div class="center"><div class="badge bad"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="informer" style="width:100%"><b>Menciónalo al cliente</b>Lamentablemente no podemos continuar con tu solicitud en este momento. Te ofrecemos una disculpa por cualquier inconveniente. Agradecemos mucho tu tiempo y te deseamos un excelente día.</div></div>`;
  }
  else if(step==="type"){
    sc.innerHTML = taskBlock()+`
      <h2>Tipo de empresa</h2>
      <div class="informer plain"><b>Info</b>Si el cliente no sabe cómo está registrado su negocio, explícale las diferencias:
        <ul><li>PFAE — Trabaja por su cuenta y su negocio está registrado a su nombre.</li><li>PM — Su negocio está registrado como una empresa legalmente constituida.</li></ul>
        Si aún tiene dudas, pregúntale si se registró ante el SAT como persona física o como una empresa con razón social propia.</div>
      <div class="row2"><button class="btn" id="pfae">PFAE</button><button class="btn" id="pm">PM</button></div>`;
    $('pfae').onclick=()=>{log.type="PFAE";step="pfae";render();};
    $('pm').onclick=()=>{log.type="PM";step="consent";render();};
  }
  else if(step==="pfae"){
    sc.innerHTML = taskBlock()+`
      <div class="center"><div class="informer" style="width:100%"><b>Rama PFAE</b>Elegiste PFAE. A partir de aquí sigues con tu guion PFAE de siempre. Este simulador cubre solo la rama PM.</div>
      <button class="btn primary" id="finishPfae" style="max-width:320px">${S.expect?'Terminar el escenario':'Volver al inicio'}</button></div>`;
    $('finishPfae').onclick=()=>S.expect?finish():start(FREE);
  }
  else if(step==="consent"){
    sc.innerHTML = taskBlock()+`
      <h2>Obtener consentimiento del cliente</h2>
      <div class="informer"><b>Menciónalo al cliente</b>Al continuar con este proceso autorizas a Banco Plata, S.A., Institución de Banca Múltiple para tratar tus datos personales de conformidad con el Aviso de Privacidad disponible en <u>bancoplata.mx</u></div>
      <div class="field" id="fConsent"><label class="check"><input type="checkbox" id="consent"> Recibí autorización del cliente</label><div class="err">Confirma tener el consentimiento del cliente</div></div>
      <button class="btn primary" id="next">Continuar</button>`;
    $('next').onclick=()=>{ if(!$('consent').checked){$('fConsent').classList.add('invalid');return;} log.consent=true; step="company"; render(); };
  }
  else if(step==="company"){
    sc.innerHTML = taskBlock()+`
      <div class="field" id="fRfc"><label class="title">RFC de la empresa</label><input class="txt" id="rfc" placeholder="12 dígitos" maxlength="13" style="text-transform:uppercase"><div class="err" id="eRfc">Completa el campo para continuar</div>${S.expect?'':'<div class="hint" style="margin:8px 0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">Para practicar, usa este RFC de ejemplo: <code id="rfcEx" style="background:var(--field);padding:2px 8px;border-radius:6px;font-size:13px">DLU190512AB3</code><button type="button" class="btn" id="copyRfc" style="width:auto;height:28px;padding:0 10px;font-size:12px">Copiar</button></div>'}</div>
      <div class="field" id="fInc"><label class="title">Ingresos mensuales esperados de la empresa</label><div class="hint">Esto nos ayudará a sugerir el mejor plan para el negocio</div><div class="money"><input class="txt" id="inc" inputmode="numeric"></div><div class="err">Completa el campo para continuar</div></div>
      <div class="field" id="fAuth"><label class="title">¿Está autorizado para abrir cuentas en nombre de la empresa?</label>
        <div class="radios"><label><input type="radio" name="auth" value="si"> Sí, están autorizados</label><label><input type="radio" name="auth" value="no"> No están autorizados</label></div>
        <div class="err">Selecciona una opción para continuar</div>
        <div class="informer warn hidden" id="noauthInf" style="margin-top:12px"><b>Solicita los datos de contacto del empleado autorizado para abrir una cuenta bancaria a nombre de la empresa</b>Las personas que no cuenten con autorización no pueden abrir cuentas bancarias en nombre de la empresa</div>
      </div>
      <button class="btn primary" id="next">Continuar</button>`;
    if($('copyRfc')) $('copyRfc').onclick=()=>{ $('rfc').value='DLU190512AB3'; $('fRfc').classList.remove('invalid'); $('copyRfc').textContent='Pegado'; setTimeout(()=>{ const b=$('copyRfc'); if(b) b.textContent='Copiar'; },1200); };
    document.querySelectorAll('input[name=auth]').forEach(r=>r.addEventListener('change',()=>{
      const no=document.querySelector('input[name=auth]:checked').value==='no';
      $('noauthInf').classList.toggle('hidden',!no); $('fAuth').classList.remove('invalid');
      $('next').classList.toggle('hidden', no);
      if(no){ log.auth='no'; log.rfc=$('rfc').value.trim().toUpperCase(); step='noauth'; transcript('noauth'); }
      else { step='company'; transcript('company'); }
    }));
    $('next').onclick=()=>{
      let ok=true;
      const rfc=$('rfc').value.trim().toUpperCase();
      $('fRfc').classList.remove('invalid');
      if(!rfc){$('eRfc').textContent='Completa el campo para continuar';$('fRfc').classList.add('invalid');ok=false;}
      else if(rfc.length!==12){$('eRfc').textContent='El RFC de la empresa debe tener 12 dígitos';$('fRfc').classList.add('invalid');ok=false;}
      else if(!/^[A-Z&Ñ]{3}\d{6}[A-Z0-9]{3}$/.test(rfc)){$('eRfc').textContent='RFC de la empresa no válido';$('fRfc').classList.add('invalid');ok=false;}
      const inc=$('inc').value.replace(/\D/g,''); $('fInc').classList.toggle('invalid',!inc); if(!inc) ok=false;
      const auth=document.querySelector('input[name=auth]:checked'); $('fAuth').classList.toggle('invalid',!auth); if(!auth) ok=false;
      if(!ok) return;
      log.rfc=rfc; log.inc=inc; log.auth=auth.value; step="person"; render();
    };
  }
  else if(step==="person"){
    sc.innerHTML = taskBlock()+`
      <div class="field stack" id="fName"><label class="title">Nombre completo</label><div class="hint">Pide al cliente que confirme su nombre completo tal como aparece en su identificación oficial.</div>
        <input class="txt" id="n1" placeholder="Nombre(s)"><input class="txt" id="n2" placeholder="Primer apellido"><input class="txt" id="n3" placeholder="Segundo apellido"><div class="err">Completa el campo para continuar</div></div>
      <div class="field" id="fDob"><label class="title">Fecha de nacimiento</label><input class="txt" id="dob" placeholder="DD/MM/AAAA" maxlength="10"><div class="err" id="eDob">Completa el campo para continuar</div></div>
      <div class="field" id="fDoc"><label class="title">Documento para verificación de identidad</label>
        <div class="informer"><b>Pregúntale al cliente</b>¿Cuentas con tu INE física y vigente? La necesitarás para mostrársela al embajador cuando recibas tu tarjeta. Asegúrate de que esté en buen estado y con tus datos actualizados.</div>
        <div class="radios"><label><input type="radio" name="doc" value="INE"> INE</label><label><input type="radio" name="doc" value="PR"> Permiso de residencia</label><label><input type="radio" name="doc" value="none"> Ninguna de las anteriores</label></div>
        <div class="err">Selecciona una opción para continuar</div>
        <div class="informer warn hidden" id="noineInf" style="margin-top:12px"><b>Menciónalo al cliente</b>Lo sentimos, pero no podemos abrir una cuenta para tu empresa sin una INE o tarjeta de residencia. Puedes volver a solicitarla en cuanto tengas alguno de estos documentos.</div>
      </div>
      <button class="btn primary" id="next">Continuar</button>`;
    $('dob').addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'').slice(0,8); if(v.length>4) v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4); else if(v.length>2) v=v.slice(0,2)+'/'+v.slice(2); e.target.value=v;});
    function saveName(){ log.names=[$('n1').value.trim(),$('n2').value.trim(),$('n3').value.trim()]; log.dob=$('dob').value.trim(); }
    document.querySelectorAll('input[name=doc]').forEach(r=>r.addEventListener('change',()=>{
      const none=document.querySelector('input[name=doc]:checked').value==='none';
      $('noineInf').classList.toggle('hidden',!none); $('fDoc').classList.remove('invalid'); $('next').classList.toggle('hidden',none);
      if(none){ saveName(); log.doc='none'; step='noine'; transcript('noine'); }
      else { step='person'; transcript('person'); }
    }));
    $('next').onclick=()=>{
      let ok=true;
      const names=[$('n1').value.trim(),$('n2').value.trim(),$('n3').value.trim()];
      $('fName').classList.toggle('invalid',names.some(n=>!n)); if(names.some(n=>!n)) ok=false;
      const dob=$('dob').value.trim(); $('fDob').classList.remove('invalid');
      if(!dob){$('eDob').textContent='Completa el campo para continuar';$('fDob').classList.add('invalid');ok=false;}
      else if(!/^\d{2}\/\d{2}\/\d{4}$/.test(dob)){$('eDob').textContent='Ingresa la fecha en formato DD/MM/AAAA';$('fDob').classList.add('invalid');ok=false;}
      const doc=document.querySelector('input[name=doc]:checked'); $('fDoc').classList.toggle('invalid',!doc); if(!doc) ok=false;
      if(!ok) return;
      saveName(); log.doc=doc.value; step="success"; render();
    };
  }
  else if(step==="success"){
    sc.innerHTML = `
      <div class="center"><div class="badge ok"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
      <div class="informer" style="width:100%"><b>Menciónalo al cliente</b>Tu solicitud se creó correctamente. Sube los documentos desde la app para que podamos revisar y aprobar tu solicitud.</div></div>`;
  }
}

/* ---------- Colgar: la llamada termina y ya ---------- */
$('hang').addEventListener('click',()=>{
  if(!S||hung) return;
  hung=true; clearInterval(timerId); clearOtp(); $('hang').disabled=true;
  log.closedAt=step;
  if(!S.expect){
    $('screen').innerHTML=`<div class="center"><div class="badge ok"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div><h2>Llamada terminada</h2><p style="color:var(--muted);margin:0 0 20px;text-align:center">En el CRM de CPA no se registra ningún resultado.</p><button class="btn primary" id="again" style="max-width:320px">Volver al inicio</button></div>`;
    $('again').onclick=()=>start(FREE); return;
  }
  finish();
});

/* ---------- Evaluación ---------- */
function finish(){
  clearInterval(timerId); clearOtp();
  const E=S.expect, checks=[];
  const add=(ok,title,why)=>checks.push({ok,title,why});
  const where=()=>log.closedAt?` Colgaste en «${STEP_NAMES[log.closedAt]||log.closedAt}».`:" No colgaste: terminaste el escenario sin cerrar la llamada.";
  // Número de teléfono
  add(log.phone===E.phone,"Número de teléfono",
    (S.id==="otro"
      ? `El cliente pidió vincular otro número: escribes el que dictó, ${fmtPhone(E.phone)}, no el de la oficina al que marcaste. El código llega a ese número.`
      : `Escribes el número que el cliente confirma: ${fmtPhone(E.phone)}. El CRM y el marcador son plataformas separadas, así que el número siempre lo capturas a mano.`)
    +(log.phone&&log.phone!==E.phone?` Capturaste ${fmtPhone(log.phone)}.`:"")+(log.phone===undefined?" No verificaste ningún número.":""));
  if(E.otpExhausted){
    // Código agotado
    add(!!log.otpExhausted,"Código",
      "Ninguno de los tres códigos que dicta el cliente es válido. Capturas cada uno tal como lo dicta; al tercer intento fallido el CRM muestra «All attempts to validate the code have been exhausted» y pasa solo a la pantalla con ✕."
      +(log.otpOk?" Llegaste a «Tipo de empresa»: capturaste un código que el cliente no dictó.":"")
      +(!log.otpOk&&!log.otpExhausted?` Solo hiciste ${log.otpAttempts||0} intento(s).`:""));
    add(log.closedAt==="otpAgotado","Cierre de la llamada",
      "Lees el texto de la pantalla tal cual y terminas la llamada con cortesía. En el CRM de CPA no se registra ningún resultado."+(log.closedAt==="otpAgotado"?"":where()));
  } else {
    // Código
    add(!!log.otpOk,"Código",
      `El cliente dicta el código ${S.otp.split('').join('-')}: lo escribes y, cuando el CRM muestra «El código es correcto», pasa solo a «Tipo de empresa».`
      +(log.otpOk&&log.otpAttempts>1?` Lo lograste al intento ${log.otpAttempts}; el código lo dicta el cliente, no hay que adivinarlo.`:"")
      +(!log.otpOk&&log.otpExhausted?" Agotaste los tres intentos.":"")+(!log.otpOk&&!log.otpExhausted?" No llegaste a «Tipo de empresa».":""));
    if(log.otpOk){
      // Rama
      if(E.type==="PFAE"){
        add(log.type==="PFAE","Elegir la rama","El cliente tiene su negocio a su nombre y su RFC tiene 13 caracteres: es PFAE. En «Tipo de empresa» va PFAE y sigues con tu guion PFAE de siempre."+(log.type==="PM"?" Elegiste PM: el CRM te habría pedido un RFC de 12 dígitos que no existe.":""));
      } else {
        add(log.type==="PM","Elegir la rama","Es una sociedad con siglas y RFC de 12 caracteres: rama PM.");
        if(log.type==="PM"){
          // Consentimiento
          add(!!log.consent,"Aviso de privacidad","Primero la frase de entrada, después el aviso completo, tal cual, y la pregunta «¿Estás de acuerdo en continuar con el proceso?». Solo con un «sí» explícito marcas «Recibí autorización del cliente».");
          // RFC
          if(E.rfc) add((log.rfc||"")===E.rfc,"RFC de la empresa",`El RFC correcto es ${E.rfc}: 12 caracteres, el de la empresa.`+(log.rfc&&log.rfc!==E.rfc?` Capturaste «${log.rfc}».`:"")+(S.id==="rfctrap"?" El primero que dictó (13 caracteres) era su RFC personal.":""));
          // Autorización
          if(E.auth) add(log.auth===E.auth,"¿Está autorizado?",E.auth==="no"?"El cliente dijo que no firma por la empresa: «No están autorizados». El CRM muestra el aviso naranja y ahí termina el flujo.":"El cliente tiene facultades según el acta: «Sí, están autorizados».");
          if(E.auth==="no"){
            add(log.closedAt==="noauth","Cierre de la llamada","Pides el contacto del autorizado (Arturo Pérez, 55 1234 5678), lo anotas como lo indique tu supervisor, agradeces y terminas la llamada. En el CRM de CPA no se registra ningún resultado."+(log.closedAt==="noauth"?"":where()));
          }
          // Nombre
          if(E.names && log.auth==="si"){
            const got=(log.names||[]).map(n=>n.toLowerCase()), want=E.names.map(n=>n.toLowerCase());
            add(got.length===3&&got.every((n,i)=>n===want[i]),"Nombre como en la INE",`Letra por letra como en la identificación: ${E.names.join(" · ")}.`+(S.id==="name"?" «Pepe» no es lo que dice la INE.":"")+(log.names&&log.names.some(n=>n)?` Capturaste: ${log.names.join(" · ")}.`:""));
            add((log.dob||"")===E.dob,"Fecha de nacimiento",`${E.dob}, en formato DD/MM/AAAA.`+(log.dob&&log.dob!==E.dob?` Capturaste «${log.dob}».`:""));
          }
          // Documento
          if(E.doc && log.auth==="si") add(log.doc===E.doc,"Documento de identidad",E.doc==="none"?"No tiene INE ni permiso de residencia; el pasaporte mexicano no sirve. «Ninguna de las anteriores»: el CRM muestra el aviso y ahí termina el flujo.":"Tiene INE vigente: INE.");
          // Cierre
          if(E.doc==="none"){
            add(log.closedAt==="noine","Cierre de la llamada","Lees el aviso de la pantalla tal cual («Lo sentimos, pero no podemos abrir una cuenta para tu empresa sin una INE o tarjeta de residencia…»), le dices que puede volver a solicitarla cuando tenga uno de esos documentos y terminas la llamada con cortesía. En el CRM de CPA no se registra ningún resultado."+(log.closedAt==="noine"?"":where()));
          } else if(E.auth==="si"){
            add(log.closedAt==="success","Cierre de la llamada","Con la solicitud creada: le dices los documentos y dónde subirlos, le ofreces quedarte en la línea para subirlos juntos y, si no puede ahora, le pides que suba todo en los próximos dos días; le explicas qué sigue y cuelgas. En el CRM de CPA no hay botón de cierre ni resultado que registrar: la llamada simplemente termina."+(log.closedAt==="success"?"":where()));
          }
        }
      }
    }
  }
  const hits=checks.filter(c=>c.ok).length, total=checks.length;
  progress[S.id]={hits,total,ok:hits===total};
  $('fbTitle').textContent = hits===total ? "✓ Escenario completo" : `${hits} de ${total} correctos`;
  $('fbIntro').textContent = hits===total ? "Hiciste todo como en una llamada bien cerrada." : "Revisa los puntos marcados en rojo y repite el escenario.";
  const ul=$('fbChecks'); ul.innerHTML='';
  checks.forEach(c=>{const li=document.createElement('li'); li.className=c.ok?'':'bad'; li.innerHTML=`<span class="dot"></span><span><b>${esc(c.title)}</b>${esc(c.why)}</span>`; ul.appendChild(li);});
  $('feedback').classList.remove('hidden');
}
$('fbRetry').onclick=()=>start(S);
$('fbMenu').onclick=()=>{ $('feedback').classList.add('hidden'); start(FREE); };

start(FREE);
</script>
</body>
</html>
